name: Release

# Run from the Actions tab with a version like v0.3.0, or push a tag like v0.3.0.
# Builds the Android APK and the GNOME extension, then publishes a GitHub release
# with that version's notes from CHANGELOG.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like v0.3.0"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and find its notes
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Version must look like v1.2.3"; exit 1; }
          awk -v v="## $VERSION" '
            index($0, v) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unpack the app's signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/butler.keystore"
          echo "BUTLER_KEYSTORE=$RUNNER_TEMP/butler.keystore" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Package the downloads
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/butler-$VERSION-android.apk"
          (cd "desktop/gnome/butler-pet@anasmasama.dev" && zip -qr "$GITHUB_WORKSPACE/dist/butler-$VERSION-gnome-extension.zip" .)
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Butler ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
