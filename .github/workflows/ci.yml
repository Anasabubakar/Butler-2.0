name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Unit tests
        run: deno test --allow-read --allow-write --allow-net --allow-env tests/
      - name: Type-check server
        run: deno task check

  laptop-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the laptop's file link
        run: python3 -m unittest desktop/gnome/test_link.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -t butler .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unpack the app's signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/butler.keystore"
          echo "BUTLER_KEYSTORE=$RUNNER_TEMP/butler.keystore" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: butler-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
